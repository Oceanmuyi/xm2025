<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D Particle Xmas Tree - Vibe Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            color: white;
            font-size: 4rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(212,175,55,0.5);
            margin: 0;
            opacity: 0.9;
            letter-spacing: 10px;
        }
        .chinese-char {
            font-size: 8rem;
            color: #ffd700;
            display: block;
            margin-top: 20px;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: blur(0px); }
            50% { transform: scale(1.1); opacity: 1; filter: blur(2px); }
        }
        .hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>MERRY CHRISTMAS</h1>
        <div class="chinese-char">源</div>
    </div>
    <div class="hint">DRAG TO ROTATE • SCROLL TO ZOOM • CLICK TO EXPLODE</div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera, renderer, particles, treeParticles;
const particleCount = 15000; // 極致華麗感：增加粒子數量

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 建立 3D 聖誕樹粒子
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        // 聖誕樹數學模型 (圓錐狀分佈)
        const height = Math.random() * 4;
        const radius = (4 - height) * 0.4;
        const angle = Math.random() * Math.PI * 2;

        // 加入一些隨機螺旋感
        const spiral = height * 1.5;
        
        const x = Math.cos(angle + spiral) * radius * (Math.random() * 0.5 + 0.8);
        const y = height - 2;
        const z = Math.sin(angle + spiral) * radius * (Math.random() * 0.5 + 0.8);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 顏色：金、白、翠綠混合
        const mix = Math.random();
        if(mix > 0.8) { // 金色
            colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.84; colors[i * 3 + 2] = 0;
        } else if (mix > 0.4) { // 暖白
            colors[i * 3] = 1.0; colors[i * 3 + 1] = 1.0; colors[i * 3 + 2] = 1.0;
        } else { // 聖誕綠
            colors[i * 3] = 0.1; colors[i * 3 + 1] = 0.5; colors[i * 3 + 2] = 0.2;
        }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.015,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });

    treeParticles = new THREE.Points(geometry, material);
    scene.add(treeParticles);

    // 背景星空粒子
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(2000 * 3);
    for(let i=0; i<6000; i++) starPos[i] = (Math.random() - 0.5) * 20;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.01 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
}

function animate() {
    requestAnimationFrame(animate);
    
    // 自動旋轉
    treeParticles.rotation.y += 0.005;
    
    // 讓粒子有呼吸感
    const time = Date.now() * 0.001;
    treeParticles.scale.x = 1 + Math.sin(time) * 0.05;
    treeParticles.scale.z = 1 + Math.sin(time) * 0.05;

    renderer.render(scene, camera);
}

// 滑鼠互動
let isDragging = false;
let previousMouseX = 0;

window.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaX = e.clientX - previousMouseX;
        treeParticles.rotation.y += deltaX * 0.01;
    }
    previousMouseX = e.clientX;
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D Physics Particle Tree - 源</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; cursor: grab; }
        .ui-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; z-index: 10;
        }
        h1 { color: white; font-size: 3.5rem; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; letter-spacing: 12px; font-weight: 200; }
        .chinese-char { font-size: 9rem; color: #ffd700; display: block; margin-top: 10px; opacity: 0.8; }
        .hint { position: absolute; bottom: 30px; width: 100%; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.7rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>MERRY CHRISTMAS</h1>
        <div class="chinese-char">源</div>
    </div>
    <div class="hint">MOUSE NEAR TO DISPERSE • CLICK TO ATTRACT • DRAG TO ROTATE</div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera, renderer, points;
const particleCount = 20000; 
let positions, originalPositions, velocities;
const mouse = new THREE.Vector2(-1000, -1000);
const raycaster = new THREE.Raycaster();
let isClicking = false;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    const geometry = new THREE.BufferGeometry();
    positions = new Float32Array(particleCount * 3);
    originalPositions = new Float32Array(particleCount * 3);
    velocities = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        // 建立 3D 聖誕樹形狀
        const h = Math.random() * 4.5;
        const r = (4.5 - h) * 0.35;
        const angle = Math.random() * Math.PI * 2;
        
        const x = Math.cos(angle) * r;
        const y = h - 2.2;
        const z = Math.sin(angle) * r;

        positions[i*3] = originalPositions[i*3] = x;
        positions[i*3+1] = originalPositions[i*3+1] = y;
        positions[i*3+2] = originalPositions[i*3+2] = z;

        velocities[i*3] = velocities[i*3+1] = velocities[i*3+2] = 0;

        const color = new THREE.Color();
        color.setHSL(0.1 + (h/10), 0.8, 0.5 + Math.random() * 0.3); // 金黃色調
        colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.012, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending
    });

    points = new THREE.Points(geometry, material);
    scene.add(points);
}

function animate() {
    requestAnimationFrame(animate);

    const posAttr = points.geometry.attributes.position;
    const time = Date.now() * 0.001;

    // 取得滑鼠在 3D 空間的投影點
    raycaster.setFromCamera(mouse, camera);
    const intersectPoint = new THREE.Vector3();
    raycaster.ray.at(5, intersectPoint); // 假設在距離 5 的平面互動

    for (let i = 0; i < particleCount; i++) {
        let x = positions[i*3];
        let y = positions[i*3+1];
        let z = positions[i*3+2];

        const ox = originalPositions[i*3];
        const oy = originalPositions[i*3+1];
        const oz = originalPositions[i*3+2];

        // 旋轉矩陣計算 (讓原始位置跟著樹轉，邏輯更自然)
        const rotSpeed = 0.005;
        const cosR = Math.cos(rotSpeed);
        const sinR = Math.sin(rotSpeed);
        originalPositions[i*3] = ox * cosR - oz * sinR;
        originalPositions[i*3+2] = ox * sinR + oz * cosR;

        // 物理計算：計算與滑鼠的距離
        const dx = x - intersectPoint.x;
        const dy = y - intersectPoint.y;
        const dz = z - intersectPoint.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

        const force = isClicking ? -0.05 : 0.15; // 點擊時吸引，平時排斥
        
        if (dist < 1.5) {
            const pull = (1.5 - dist) * force;
            velocities[i*3] += (dx / dist) * pull;
            velocities[i*3+1] += (dy / dist) * pull;
            velocities[i*3+2] += (dz / dist) * pull;
        }

        // 回復力：讓粒子想要回到樹的原位
        velocities[i*3] += (originalPositions[i*3] - x) * 0.03;
        velocities[i*3+1] += (originalPositions[i*3+1] - y) * 0.03;
        velocities[i*3+2] += (originalPositions[i*3+2] - z) * 0.03;

        // 摩擦力：讓運動平滑
        velocities[i*3] *= 0.92;
        velocities[i*3+1] *= 0.92;
        velocities[i*3+2] *= 0.92;

        positions[i*3] += velocities[i*3];
        positions[i*3+1] += velocities[i*3+1];
        positions[i*3+2] += velocities[i*3+2];
    }

    posAttr.needsUpdate = true;
    renderer.render(scene, camera);
}

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('mousedown', () => { isClicking = true; document.body.style.cursor = 'grabbing'; });
window.addEventListener('mouseup', () => { isClicking = false; document.body.style.cursor = 'grab'; });

init();
animate();
</script>
</body>
