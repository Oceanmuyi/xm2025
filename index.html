<!DOCTYPE html>
<html>
<head>
  <title>雪准 - 单板重心检测预览版</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: 'PingFang SC', sans-serif; text-align: center; background: #2c3e50; color: white; padding: 20px; }
    .author { font-size: 14px; color: #bdc3c7; margin-bottom: 20px; }
    #status { font-size: 20px; font-weight: bold; margin: 10px auto; padding: 15px; border-radius: 10px; width: 90%; max-width: 600px; }
    .safe { background: #27ae60; }
    .danger { background: #e74c3c; animation: blink 0.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    canvas { width: 100%; max-width: 640px; border-radius: 15px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .error-hint { font-size: 12px; color: #95a5a6; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🏂 雪准 AI 重心实验室</h1>
  <div class="author">by 万源</div>
  <div id="status" class="safe">正在尝试连接 AI 引擎 (可能需要 10-20 秒)...</div>
  <video id="input_video" style="display:none" playsinline></video>
  <canvas id="output_canvas"></canvas>
  <div class="error-hint">如果长时间无响应，请尝试：1. 开启手机流量测试 2. 检查摄像头是否授权</div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('status');

    function onResults(results) {
      if (statusDiv.innerText.includes("连接")) {
        statusDiv.innerText = "✅ AI 运行中";
      }
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
        
        // 核心重心算法
        const hip = results.poseLandmarks[24];
        const ankle = results.poseLandmarks[28];
        const diff = hip.x - ankle.x; 
        
        if (diff > 0.12) { 
          statusDiv.innerText = "⚠️ 警告：重心后坐（坐马桶）！";
          statusDiv.className = "danger";
        } else {
          statusDiv.innerText = "✅ 重心位置良好";
          statusDiv.className = "safe";
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
      }
    });

    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    // 强力唤醒摄像头逻辑
    async function startCamera() {
      const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
      });
      try {
        await camera.start();
      } catch (e) {
        statusDiv.innerText = "❌ 摄像头无法访问，请检查权限";
        statusDiv.className = "danger";
      }
    }

    startCamera();
  </script>
</body>
</html>
