<!DOCTYPE html>
<html>
<head>
  <title>雪准 - 单板重心检测预览版</title>
  <script src="https://lf26-cdn-tos.bytecdntimes.com/obj/static/itc/mediapipe/pose/pose.js"></script>
  <script src="https://lf26-cdn-tos.bytecdntimes.com/obj/static/itc/mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://lf26-cdn-tos.bytecdntimes.com/obj/static/itc/mediapipe/drawing_utils/drawing_utils.js"></script>
  <style>
    body { font-family: 'PingFang SC', sans-serif; text-align: center; background: #2c3e50; color: white; padding: 20px; }
    .author { font-size: 14px; color: #bdc3c7; margin-bottom: 20px; }
    #status { font-size: 20px; font-weight: bold; margin: 10px auto; padding: 15px; border-radius: 10px; width: 90%; max-width: 600px; }
    .safe { background: #27ae60; }
    .danger { background: #e74c3c; animation: blink 0.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    canvas { width: 100%; max-width: 640px; border-radius: 15px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h1>🏂 雪准 AI 重心实验室</h1>
  <div class="author">by 万源</div>
  <div id="status" class="safe">正在连接国内 AI 引擎...</div>
  <video id="input_video" style="display:none" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('status');

    // 超时检测：如果 15 秒还没加载好，给出提示
    const timeout = setTimeout(() => {
        if (statusDiv.innerText.includes("正在连接")) {
            statusDiv.innerText = "❌ 加载超时，请刷新页面或检查网络";
            statusDiv.className = "danger";
        }
    }, 15000);

    function onResults(results) {
      clearTimeout(timeout); // 加载成功，取消超时检测
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
        
        // 逻辑判断
        const hip = results.poseLandmarks[24];
        const ankle = results.poseLandmarks[28];
        const diff = hip.x - ankle.x; 
        
        if (diff > 0.12) { 
          statusDiv.innerText = "⚠️ 警告：重心后坐！";
          statusDiv.className = "danger";
        } else {
          statusDiv.innerText = "✅ 重心位置良好";
          statusDiv.className = "safe";
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => {
        // 同样使用字节跳动的镜像节点
        return `https://lf26-cdn-tos.bytecdntimes.com/obj/static/itc/mediapipe/pose/${file}`;
      }
    });

    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });

    camera.start().then(() => {
        statusDiv.innerText = "✅ AI 准备就绪";
    }).catch(err => {
        statusDiv.innerText = "❌ 摄像头开启失败";
        statusDiv.className = "danger";
    });
  </script>
</body>
</html>
